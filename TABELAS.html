<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechZone - Sua Loja de Tecnologia</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }

        header {
            background-color: #1e293b;
            color: #fff;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        header h1 {
            margin-bottom: 5px;
        }

        nav a {
            color: #38bdf8;
            text-decoration: none;
            margin: 0 10px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .section-title {
            margin: 30px 0 15px;
            color: #0f172a;
            border-left: 5px solid #0284c7;
            padding-left: 10px;
        }

        /* --- ESTILIZAÇÃO DAS TABELAS --- */
        .table-responsive {
            overflow-x: auto;
            margin-bottom: 30px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            padding: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 15px;
            border: 1px solid #e2e8f0;
        }

        /* Estilo do Cabeçalho */
        thead th {
            background-color: #0284c7;
            color: #ffffff;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        /* Efeito Zebrado (Striped) */
        tbody tr:nth-child(even) {
            background-color: #f8fafc;
        }

        /* Efeito Hover na linha */
        tbody tr:hover {
            background-color: #f1f5f9;
        }

        /* Imagens da Tabela */
        .product-img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 4px;
        }

        /* Alinhamentos Especiais */
        .text-center { text-align: center; }
        .text-right { text-align: right; }
        .bold { font-weight: bold; }

        /* Estilo para Preço e Botão */
        .price {
            color: #16a34a;
            font-weight: bold;
        }
